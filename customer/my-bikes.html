<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Bikes — Bike Service Booking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>

<header class="site-header">
  <nav class="nav">
    <a href="/index.html" class="brand"><span class="dot"></span> Bike Service Booking</a>
    <div class="nav-links" id="nav-links"></div>
  </nav>
</header>

<main class="app-main">
  <div class="page-head">
    <div><span class="eyebrow">// customer</span><h1>My Bikes</h1></div>
    <a href="/customer/add-bike.html" class="btn btn-primary btn-sm">+ Add bike</a>
  </div>

  <div id="content"></div>
</main>

<script src="../js/api.js"></script>
<script>
  requireRole("customer");
  const content = document.getElementById("content");

  async function load() {
    const bikes = await apiFetch("/api/bikes/mine");
    if (!bikes.length) {
      content.innerHTML = `<div class="empty-state">No bikes yet. <a href="/customer/add-bike.html">Add your first bike</a> to start booking services.</div>`;
      return;
    }
    content.innerHTML = `
      <div class="table-wrap">
        <table>
          <thead><tr><th>Bike Name</th><th>Company</th><th>Model No</th><th>Registration No</th></tr></thead>
          <tbody>
            ${bikes.map(b => `
              <tr>
                <td>${b.bike_name}</td>
                <td>${b.company}</td>
                <td class="mono">${b.model_number}</td>
                <td class="mono">${b.registration_number}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>`;
  }

  load();
</script>
</body>
</html>
